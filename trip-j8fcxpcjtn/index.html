<style>

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; padding: 16px; }
  form { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 22px;

  p { margin: 0; color: var(--muted); font-size: 15px; }
  label { font-size: 14px; font-weight: 600; }
  input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button { font: 600 16px/1 inherit; font-family: inherit; padding: 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card); cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 500; color: var(--muted); }
  .check input { width: 18px; height: 18px; accent-color: var(--ink); }
  .err { color: var(--accent); font-size: 14px; font-weight: 600; min-height: 1.4em; }
</style>

  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }
  async function unlock(secret) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(secret)), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, key, bytes(DATA.ct));
    return new TextDecoder().decode(plain);
  }
  function show(html, secret) {
    if (remember.checked) { try { localStorage.setItem(KEY, norm(secret)); } catch (e) {} }
    document.open(); document.write(html); document.close();
  }
  async function attempt(secret, quiet) {
    err.textContent = '';
    go.disabled = true; go.textContent = 'Opening…';
    try { show(await unlock(secret), secret); return true; }
    catch (e) {
      go.disabled = false; go.textContent = 'Unlock';
      if (!quiet) { err.textContent = 'Those words don’t match. Check the spelling and try again.'; pw.select(); }
      return false;
    }
  }
  form.addEventListener('submit', function (ev) { ev.preventDefault(); attempt(pw.value, false); });
  // One-tap link (#words) or a device that unlocked before
  var fromLink = decodeURIComponent(location.hash.slice(1) || '');
  if (fromLink) history.replaceState(null, '', location.pathname);
  var saved = ''; try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
  if (fromLink || saved) attempt(fromLink || saved, true).then(function (ok) {
    if (!ok && saved) { try { localStorage.removeItem(KEY); } catch (e) {} }
  });
})();
</script>
